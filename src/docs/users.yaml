paths:
  /api/users:
    get:
      summary: Obtener todos los usuarios
      tags:
        - Users
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"

components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          example: 65f0c2a9b9b1a2c3d4e5f678
        first_name:
          type: string
          example: Matias
        last_name:
          type: string
          example: Romero
        email:
          type: string
          example: romeromatias92@gmail.com
        role:
          type: string
          example: user